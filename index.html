<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lucy: Prince Fireball's Revenge</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050c;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#controls{position:fixed;inset:0;z-index:5;pointer-events:none}
.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
#leftpad{left:18px}#rightpad{right:18px}
button{width:clamp(64px,13vw,104px);height:clamp(64px,13vw,104px);border-radius:50%;border:2px solid #6aff9a;background:rgba(5,14,25,.88);color:#fff;font:bold clamp(17px,3vw,27px) Arial;box-shadow:0 0 20px rgba(70,255,140,.55);touch-action:none}
button.active,button:active{background:#6aff9a;color:#041009;transform:scale(.94)}
#jump{border-color:#75aaff}#attack{border-color:#c77cff;box-shadow:0 0 22px rgba(190,100,255,.7)}
#rotate{display:none;position:fixed;z-index:20;inset:0;background:#05050c;color:#7dff9c;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
 <div class="pad" id="leftpad"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="pad" id="rightpad"><button id="jump">JUMP</button><button id="attack">🐾</button></div>
</div>
<div id="rotate">🐕‍🦺<br><br>Rotate to landscape to play Lucy's adventure</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR,last=0,cam=0,state='menu',level=0,score=0;
const input={left:false,right:false,jump:false,attack:false};
const levels=[
 {name:'ROBO CITY',theme:'#00d9ff',sky1:'#06091b',sky2:'#17214a',len:3000},
 {name:'TOXIC TUNNELS',theme:'#5dff72',sky1:'#07150d',sky2:'#123825',len:3300},
 {name:'SKY FORTRESS',theme:'#a878ff',sky1:'#120c22',sky2:'#3a2859',len:3600},
 {name:'THE FIRE PALACE',theme:'#ff6538',sky1:'#180707',sky2:'#4b1610',len:3900}
];
let lucy,enemies,platforms,bones,blasts,particles,goal,boss;

function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

function bind(id,key,hold=true){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;b.classList.add('active')});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{if(hold)input[key]=false;b.classList.remove('active')}));
}
bind('left','left');bind('right','right');bind('jump','jump',false);bind('attack','attack',false);
addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=true;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=true;
 if(['Space','ArrowUp','KeyW'].includes(e.code))input.jump=true;
 if(['KeyF','KeyX'].includes(e.code))input.attack=true;
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=false;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=false;
});

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:.6,color})}

function loadLevel(n){
 level=n; const gy=H-120,L=levels[n].len;
 lucy={x:90,y:gy-55,w:70,h:55,vx:0,vy:0,onGround:false,face:1,hp:5,inv:0,cool:0,bark:0};
 platforms=[
  {x:0,y:gy,w:700,h:48},{x:820,y:gy,w:700,h:48},{x:1650,y:gy,w:720,h:48},{x:2520,y:gy,w:L-2520,h:48},
  {x:330,y:gy-130,w:190,h:26},{x:650,y:gy-230,w:180,h:26},{x:1120,y:gy-150,w:190,h:26},
  {x:1500,y:gy-240,w:180,h:26},{x:2000,y:gy-150,w:190,h:26}
 ];
 bones=[]; for(let x=200;x<L-120;x+=135)bones.push({x,y:gy-70-(Math.floor(x/135)%4)*30,taken:false});
 blasts=[];particles=[];boss=null;
 if(n<3){
  const types=['rat','forky','brain','rat','brain','forky','rat'];
  enemies=types.map((type,i)=>({type,x:430+i*(L-750)/(types.length-1),y:gy-58,w:type==='forky'?46:58,h:type==='forky'?68:58,vx:(i%2?1:-1)*(type==='rat'?95:60),vy:0,hp:type==='forky'?3:2,dead:false}));
  goal={x:L-115,y:gy-110,w:30,h:110};
 }else{
  enemies=[]; goal=null;
  boss={x:L-700,y:gy-140,w:100,h:140,vx:0,vy:0,hp:30,maxHp:30,cool:2,phase:1,active:false};
 }
 cam=0;
}

function moveEntity(o,dt){
 o.x+=o.vx*dt;
 for(const p of platforms)if(overlap(o,p)){
  if(o.vx>0)o.x=p.x-o.w; else if(o.vx<0)o.x=p.x+p.w;
  o.vx=0;
 }
 o.y+=o.vy*dt;o.onGround=false;
 for(const p of platforms)if(overlap(o,p)){
  if(o.vy>0){o.y=p.y-o.h;o.onGround=true}
  else if(o.vy<0)o.y=p.y+p.h;
  o.vy=0;
 }
}

function barkBlast(){
 if(lucy.cool>0)return;
 lucy.cool=.45;lucy.bark=.22;
 blasts.push({x:lucy.x+(lucy.face>0?lucy.w:-18),y:lucy.y+22,w:32,h:28,vx:lucy.face*650,life:.65,kind:'bark'});
 burst(lucy.x+35,lucy.y+25,'#c783ff',10);
}
function enemyShot(x,y,dir){
 blasts.push({x,y,w:22,h:22,vx:dir*430,life:3,kind:'fire'});
}

function hurt(){
 if(lucy.inv>0)return;
 lucy.hp--;lucy.inv=1.1;burst(lucy.x+35,lucy.y+25,'#ff3c5c',18);
 if(lucy.hp<=0)state='gameover';
}

function update(dt){
 if(state==='menu'){
  if(input.jump||input.attack){input.jump=input.attack=false;score=0;loadLevel(0);state='play'}
  return;
 }
 if(state==='gameover'){
  if(input.jump||input.attack){input.jump=input.attack=false;loadLevel(level);state='play'}
  return;
 }
 if(state==='victory'){
  if(input.jump||input.attack){input.jump=input.attack=false;state='menu'}
  return;
 }

 if(input.jump&&lucy.onGround){lucy.vy=-650;lucy.onGround=false}
 input.jump=false;
 if(input.attack)barkBlast();input.attack=false;
 lucy.vx=(input.left?-310:0)+(input.right?310:0);
 if(lucy.vx)lucy.face=Math.sign(lucy.vx);
 lucy.vy+=1600*dt;lucy.cool-=dt;lucy.inv-=dt;lucy.bark-=dt;
 moveEntity(lucy,dt);
 if(lucy.y>H+200)state='gameover';

 for(const e of enemies){
  e.vy+=1600*dt;moveEntity(e,dt);
  if(e.vx===0)e.vx=(Math.random()>.5?1:-1)*(e.type==='rat'?95:60);
  if(overlap(lucy,e)&&lucy.inv<=0){
   if(lucy.vy>120&&lucy.y+lucy.h<e.y+30){e.hp--;lucy.vy=-400;if(e.hp<=0){e.dead=true;score+=100;burst(e.x,e.y,'#70ff80',20)}}
   else hurt();
  }
 }
 enemies=enemies.filter(e=>!e.dead);

 if(boss){
  if(!boss.active && lucy.x>boss.x-500)boss.active=true;
  if(boss.active){
   boss.phase=boss.hp<15?2:1;
   boss.cool-=dt;
   const target=lucy.x-boss.x;
   boss.vx=Math.abs(target)>250?Math.sign(target)*(boss.phase===2?90:55):0;
   boss.x+=boss.vx*dt;
   boss.cool=boss.cool<0? (boss.phase===2?0.7:1.25) : boss.cool;
   if(boss.cool===0){} // retained safety
   if(boss.cool<0.03 && boss.cool> -0.03){
     enemyShot(boss.x+30,boss.y+55,Math.sign(target)||-1);
     if(boss.phase===2)enemyShot(boss.x+55,boss.y+70,Math.sign(target)||-1);
   }
   if(overlap(lucy,boss)&&lucy.inv<=0)hurt();
  }
 }

 for(const b of blasts){
  b.x+=b.vx*dt;b.life-=dt;
  if(b.kind==='bark'){
   for(const e of enemies)if(!e.dead&&overlap(b,e)){e.hp--;b.life=0;burst(e.x,e.y,'#b879ff',16);if(e.hp<=0){e.dead=true;score+=100}}
   if(boss&&boss.active&&overlap(b,boss)){boss.hp--;b.life=0;burst(boss.x+50,boss.y+60,'#79ff52',16);if(boss.hp<=0){score+=1000;burst(boss.x,boss.y,'#ffb03c',60);state='victory'}}
  }else if(b.kind==='fire'&&overlap(b,lucy)){b.life=0;hurt()}
 }
 blasts=blasts.filter(b=>b.life>0); enemies=enemies.filter(e=>!e.dead);

 for(const b of bones)if(!b.taken&&Math.abs(lucy.x+35-b.x)<38&&Math.abs(lucy.y+28-b.y)<45){
  b.taken=true;score+=25;burst(b.x,b.y,'#ffe46b',8);
 }
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);

 if(goal&&overlap(lucy,goal)){if(level<3)loadLevel(level+1)}
 cam=Math.max(0,Math.min(lucy.x-W*.38,levels[level].len-W));
}

function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur}
function drawLucy(){
 const x=lucy.x,y=lucy.y;
 glow('#777',12);
 // chubby black Labrador body
 ctx.fillStyle='#17191d';ctx.beginPath();ctx.ellipse(x+39,y+34,34,22,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.fillRect(x+22,y+44,11,13);ctx.fillRect(x+56,y+44,11,13);
 // head
 ctx.fillStyle='#202329';ctx.beginPath();ctx.arc(x+18,y+20,22,0,Math.PI*2);ctx.fill();
 // floppy ears
 ctx.fillStyle='#101114';ctx.beginPath();ctx.ellipse(x+4,y+25,9,17,.4,0,Math.PI*2);ctx.fill();
 // muzzle and eye
 ctx.fillStyle='#34383d';ctx.beginPath();ctx.ellipse(x+2,y+26,14,10,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffdf8a';ctx.beginPath();ctx.arc(x+15,y+14,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(x-5,y+24,4,0,Math.PI*2);ctx.fill();
 // glowing collar
 ctx.strokeStyle='#55ff98';ctx.lineWidth=4;glow('#55ff98',12);ctx.beginPath();ctx.arc(x+21,y+35,14,.2,2.8);ctx.stroke();
 ctx.shadowBlur=0;
 // tail
 ctx.strokeStyle='#17191d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+70,y+30);ctx.quadraticCurveTo(x+86,y+15+Math.sin(performance.now()/130)*5,x+92,y+25);ctx.stroke();
}

function drawEnemy(e){
 if(e.type==='rat'){
  ctx.fillStyle='#667080';ctx.beginPath();ctx.ellipse(e.x+29,e.y+36,30,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e43d54';glow('#ff3c55',10);ctx.fillRect(e.x+12,e.y+25,7,6);ctx.fillRect(e.x+28,e.y+25,7,6);
 }else if(e.type==='forky'){
  ctx.fillStyle='#aa6cff';ctx.fillRect(e.x+10,e.y+24,28,44);
  for(let i=0;i<4;i++)ctx.fillRect(e.x+4+i*10,e.y,5,26);
 }else{
  ctx.fillStyle='#65df6a';glow('#65ff72',15);ctx.beginPath();ctx.arc(e.x+29,e.y+29,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a5b24';for(let i=0;i<4;i++)ctx.fillRect(e.x+8+i*11,e.y+12+(i%2)*9,8,5);
 }
 ctx.shadowBlur=0;
}

function drawBoss(){
 if(!boss)return;
 const x=boss.x,y=boss.y;
 glow('#ff5638',22);
 // cloak
 ctx.fillStyle='#361016';ctx.beginPath();ctx.moveTo(x+18,y+45);ctx.lineTo(x+82,y+45);ctx.lineTo(x+100,y+140);ctx.lineTo(x,y+140);ctx.closePath();ctx.fill();
 // body
 ctx.fillStyle='#1f2a27';ctx.fillRect(x+30,y+55,40,65);
 // head
 ctx.fillStyle='#d9b78a';ctx.beginPath();ctx.arc(x+50,y+34,25,0,Math.PI*2);ctx.fill();
 // crown
 ctx.fillStyle='#f0bf3e';ctx.beginPath();ctx.moveTo(x+28,y+18);ctx.lineTo(x+35,y);ctx.lineTo(x+50,y+16);ctx.lineTo(x+66,y);ctx.lineTo(x+73,y+18);ctx.closePath();ctx.fill();
 // green flame hand
 ctx.fillStyle='#66ff3d';glow('#6dff42',25);ctx.beginPath();ctx.arc(x+83,y+68,16,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
}

function draw(){
 const L=levels[level],grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,L.sky1);grad.addColorStop(1,L.sky2);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 // futuristic skyline
 for(let i=0;i<30;i++){
  const x=i*160-cam*.18,h=90+(i*53%180);
  ctx.fillStyle='rgba(35,50,85,.35)';ctx.fillRect(x,H-120-h,110,h);
  ctx.fillStyle='rgba(100,160,220,.16)';ctx.fillRect(x+15,H-105-h,8,4);
 }
 if(level===3){ctx.fillStyle='rgba(255,70,20,.18)';ctx.fillRect(0,H-90,W,90)}

 if(state==='menu'){
  ctx.textAlign='center';
  glow('#6aff9a',25);ctx.fillStyle='#6aff9a';ctx.font='bold 52px Arial';ctx.fillText('LUCY',W/2,H*.27);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold 27px Arial';ctx.fillText('THE BLACK LABRADOR',W/2,H*.27+38);
  ctx.fillStyle='#c7ffdc';ctx.font='20px Arial';ctx.fillText("A futuristic adventure to defeat Prince Fireball",W/2,H*.27+76);
  ctx.font='bold 27px Arial';ctx.fillStyle='#ffd866';ctx.fillText('TAP JUMP OR 🐾 TO START',W/2,H*.63);
  ctx.font='18px Arial';ctx.fillStyle='#fff';ctx.fillText('4 Levels • Boss Battle • iPad & iPhone Touch Controls',W/2,H*.63+38);
  ctx.textAlign='left';return;
 }

 ctx.save();ctx.translate(-cam,0);
 for(const p of platforms){
  ctx.fillStyle='#172339';ctx.fillRect(p.x,p.y,p.w,p.h);
  glow(L.theme,10);ctx.fillStyle=L.theme;ctx.fillRect(p.x,p.y,p.w,4);ctx.shadowBlur=0;
 }
 for(const b of bones)if(!b.taken){
  glow('#ffe36a',14);ctx.strokeStyle='#ffe36a';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(b.x-8,b.y);ctx.lineTo(b.x+8,b.y);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x-10,b.y,5,0,Math.PI*2);ctx.arc(b.x+10,b.y,5,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
 }
 for(const e of enemies)drawEnemy(e);
 if(goal){glow(L.theme,24);ctx.fillStyle=L.theme;ctx.fillRect(goal.x,goal.y,goal.w,goal.h);ctx.shadowBlur=0}
 if(boss)drawBoss();
 drawLucy();

 for(const b of blasts){
  if(b.kind==='bark'){glow('#c783ff',22);ctx.fillStyle='#c783ff';ctx.beginPath();ctx.arc(b.x,b.y,16,0,Math.PI*2);ctx.fill()}
  else {glow('#65ff3e',24);ctx.fillStyle='#65ff3e';ctx.beginPath();ctx.arc(b.x,b.y,11,0,Math.PI*2);ctx.fill()}
  ctx.shadowBlur=0;
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.7);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}
 ctx.globalAlpha=1;ctx.restore();

 // HUD
 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(12,12,480,64);
 ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText('🐕‍🦺 LUCY THE BLACK LABRADOR',25,35);
 ctx.fillStyle='#ff4564';ctx.font='23px Arial';ctx.fillText('♥'.repeat(Math.max(0,lucy.hp)),25,63);
 ctx.fillStyle='#ffe36a';ctx.fillText('✦ '+score,145,63);
 ctx.fillStyle='#cbd5ff';ctx.font='16px Arial';ctx.fillText('LEVEL '+(level+1)+' · '+L.name,245,63);

 if(boss&&boss.active){
  const bw=Math.min(350,W*.45),x=W/2-bw/2;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x,18,bw,36);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('FINAL BOSS — PRINCE FIREBALL',W/2,32);
  ctx.fillStyle='#3b1111';ctx.fillRect(x+5,38,bw-10,10);
  ctx.fillStyle='#ff5638';ctx.fillRect(x+5,38,(bw-10)*(boss.hp/boss.maxHp),10);ctx.textAlign='left';
 }

 if(state==='gameover'||state==='victory'){
  ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle=state==='victory'?'#6aff9a':'#ff4a68';ctx.font='bold 44px Arial';
  ctx.fillText(state==='victory'?'LUCY SAVES THE FUTURE!':'LUCY NEEDS ANOTHER TRY!',W/2,H/2-25);
  ctx.fillStyle='#fff';ctx.font='21px Arial';
  ctx.fillText(state==='victory'?'Prince Fireball has been defeated!':'Tap JUMP or 🐾 to retry',W/2,H/2+25);
  ctx.textAlign='left';
 }
}

function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
