<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lucy & Leo: Prince Fireball's Revenge</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;background:#05050c;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh}
#controls{position:fixed;inset:0;z-index:5;pointer-events:none}
.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
#leftpad{left:18px}#rightpad{right:18px}
button{width:clamp(52px,9vw,82px);height:clamp(52px,9vw,82px);border-radius:50%;border:2px solid #6aff9a;background:rgba(5,14,25,.88);color:#fff;font:bold clamp(17px,3vw,27px) Arial;box-shadow:0 0 20px rgba(70,255,140,.55);touch-action:none}
button.active,button:active{background:#6aff9a;color:#041009;transform:scale(.94)}
#jump{border-color:#75aaff}#attack{border-color:#c77cff;box-shadow:0 0 22px rgba(190,100,255,.7)}
#levelmsg{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:4;color:#fff;text-align:center;font-weight:bold;font-size:clamp(18px,3vw,32px);text-shadow:0 0 16px #6aff9a;pointer-events:none;opacity:0;transition:opacity .35s}#rotate{display:none;position:fixed;z-index:20;inset:0;background:#05050c;color:#7dff9c;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="sound" style="position:fixed;top:12px;right:12px;z-index:10;width:52px;height:52px;font-size:22px">🔊</button><div id="controls">
 <div class="pad" id="leftpad"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="pad" id="rightpad"><button id="jump">JUMP</button><button id="attack">🐾</button></div>
</div>
<div id="levelmsg"></div><div id="rotate">🐕‍🦺<br><br>Rotate to landscape to play Lucy's adventure</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR,last=0,cam=0,state='menu',level=0,score=0;

const input={left:false,right:false,jump:false,attack:false};

// Synthesised game sound engine — no external audio files needed.
let audioCtx=null, soundOn=true, musicTimer=null, musicStep=0;
function initAudio(){
 if(!audioCtx){
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   audioCtx=new AC();
 }
 if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(freq,duration=.12,type='sine',volume=.06,slide=0){
 if(!soundOn)return;initAudio();if(!audioCtx)return;
 const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(Math.max(20,freq),now);
 if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,slide),now+duration);
 gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
 osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02);
}
function noise(duration=.15,volume=.06){
 if(!soundOn)return;initAudio();if(!audioCtx)return;
 const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*duration),audioCtx.sampleRate);
 const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
 const src=audioCtx.createBufferSource(),gain=audioCtx.createGain();src.buffer=buffer;
 gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 src.connect(gain).connect(audioCtx.destination);src.start();src.stop(audioCtx.currentTime+duration);
}
function sfx(name){
 if(!soundOn)return;
 if(name==='jump'){tone(420,.10,'square',.055,760)}
 if(name==='double'){tone(560,.12,'square',.055,900)}
 if(name==='bark'){tone(180,.08,'sawtooth',.08,340);tone(700,.08,'square',.035,450)}
 if(name==='hit'){tone(120,.18,'sawtooth',.09,45);noise(.12,.045)}
 if(name==='collect'){tone(880,.08,'sine',.05,1180)}
 if(name==='enemy'){tone(300,.12,'square',.05,110)}
 if(name==='bomb'){noise(.25,.11);tone(95,.28,'sawtooth',.08,30)}
 if(name==='bossHit'){tone(170,.18,'sawtooth',.08,70);tone(480,.08,'square',.04,220)}
 if(name==='win'){tone(523,.12,'sine',.06);setTimeout(()=>tone(659,.12,'sine',.06),120);setTimeout(()=>tone(784,.28,'sine',.07),240)}
 if(name==='lose'){tone(220,.35,'sawtooth',.06,55)}
}
function startMusic(){
 if(musicTimer||!soundOn)return;
 const notes=[196,247,294,247,220,262,330,262];
 musicTimer=setInterval(()=>{if(state==='play'&&soundOn)tone(notes[musicStep++%notes.length],.18,'triangle',.018)},420);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

const levels=[
 {name:'ROBO CITY',theme:'#00d9ff',sky1:'#06091b',sky2:'#17214a',len:3000},
 {name:'TOXIC TUNNELS',theme:'#5dff72',sky1:'#07150d',sky2:'#123825',len:3300},
 {name:'SKY FORTRESS',theme:'#a878ff',sky1:'#120c22',sky2:'#3a2859',len:3600},
 {name:'THE FIRE PALACE',theme:'#ff6538',sky1:'#180707',sky2:'#4b1610',len:3900}
];
let lucy,leo,enemies,platforms,bones,blasts,particles,obstacles,goal,boss,movingPlatforms,levelBanner=0,bonesCollected=0;

function resize(){
 const vv=window.visualViewport;
 W=Math.round(vv ? vv.width : window.innerWidth);
 H=Math.round(vv ? vv.height : window.innerHeight);
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize)}resize();

function bind(id,key,hold=true){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;b.classList.add('active')});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{if(hold)input[key]=false;b.classList.remove('active')}));
}
bind('left','left');bind('right','right');bind('jump','jump',false);bind('attack','attack',false);
const soundButton=document.getElementById('sound');
soundButton.addEventListener('pointerdown',e=>{
 e.preventDefault();soundOn=!soundOn;
 soundButton.textContent=soundOn?'🔊':'🔇';
 if(soundOn){initAudio();startMusic();tone(660,.08,'sine',.04)}else stopMusic();
});

addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=true;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=true;
 if(['Space','ArrowUp','KeyW'].includes(e.code))input.jump=true;
 if(['KeyF','KeyX'].includes(e.code))input.attack=true;
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=false;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=false;
});

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:.6,color})}

function loadLevel(n){
 level=n; const gy=H-120,L=levels[n].len;
 lucy={x:90,y:gy-55,w:70,h:55,vx:0,vy:0,onGround:false,face:1,hp:5,maxHp:5,inv:0,cool:0,bark:0,jumps:0,coyote:.12};
 leo={x:15,y:gy-48,w:58,h:46,vx:0,vy:0,onGround:false,face:1,attack:0,attackCool:0};
 platforms=[
  {x:0,y:gy,w:700,h:48},{x:820,y:gy,w:700,h:48},{x:1650,y:gy,w:720,h:48},{x:2520,y:gy,w:L-2520,h:48},
  // Lower, easier platforms for smoother iPad gameplay
  {x:330,y:gy-75,w:170,h:24},{x:620,y:gy-120,w:160,h:24},{x:930,y:gy-80,w:175,h:24},
  {x:1250,y:gy-110,w:160,h:24},{x:1500,y:gy-85,w:170,h:24},{x:1840,y:gy-120,w:165,h:24},
  {x:2150,y:gy-75,w:180,h:24}
 ];
 movingPlatforms=[];
 if(n===1)movingPlatforms.push({x:1420,y:gy-110,w:180,h:24,baseX:1420,range:180,speed:1.2,t:0});
 if(n===2)movingPlatforms.push({x:760,y:gy-180,w:160,h:24,baseX:760,range:220,speed:1.5,t:0});
 bones=[]; for(let x=190;x<L-120;x+=125)bones.push({x,y:gy-70-(Math.floor(x/125)%4)*30,taken:false,bob:Math.random()*6});
 blasts=[];particles=[];boss=null;bonesCollected=0;
 obstacles=[];
 // Orange fizzy "Fanta Bomb" hazards — jump over them or blast them from a distance.
 const bombXs = n===0?[560,980,1390,1880,2450]:n===1?[500,1080,1720,2360,2860]:n===2?[620,1180,1900,2700,3200]:[750,1450,2200,3000];
 obstacles=bombXs.map((x,i)=>({x,y:gy-42,w:42,h:42,dead:false,blink:i*0.7,armed:true}));
 if(n<3){
  const types=n===0?['rat','trump','brain','forky','rat','brain','forky']:
              n===1?['brain','rat','trump','forky','brain','forky','rat','brain']:
                    ['rat','forky','trump','brain','forky','rat','brain','forky','brain'];
  enemies=types.map((type,i)=>({type,x:430+i*(L-750)/(types.length-1),y:gy-58,w:type==='forky'?46:type==='trump'?54:58,h:type==='forky'?68:type==='trump'?72:58,vx:(i%2?1:-1)*(type==='rat'?95:type==='trump'?48:60),vy:0,hp:type==='forky'?3:type==='trump'?4:2,dead:false,startX:0}));
  enemies.forEach(e=>{e.startX=e.x});
  goal={x:L-115,y:gy-110,w:30,h:110};
 }else{
  enemies=[]; goal=null;
  boss={x:L-700,y:gy-140,w:100,h:140,vx:0,vy:0,hp:12,maxHp:12,cool:2,phase:1,active:false,hitFlash:0,summon:5,defeated:false};
 }
 cam=0;
 showLevelBanner('LEVEL '+(n+1)+' — '+levels[n].name);
}
function moveEntity(o,dt){
 const allPlatforms=platforms.concat(movingPlatforms||[]);
 o.x+=o.vx*dt;
 for(const p of allPlatforms)if(overlap(o,p)){
  if(o.vx>0)o.x=p.x-o.w; else if(o.vx<0)o.x=p.x+p.w;
  o.vx=0;
 }
 o.y+=o.vy*dt;o.onGround=false;
 for(const p of allPlatforms)if(overlap(o,p)){
  if(o.vy>0){o.y=p.y-o.h;o.onGround=true;if(p.baseX!==undefined)o.x+=Math.cos(p.t*p.speed)*p.range*.6*dt}
  else if(o.vy<0)o.y=p.y+p.h;
  o.vy=0;
 }
}
function showLevelBanner(text){
 const el=document.getElementById('levelmsg');
 el.textContent=text;el.style.opacity='1';
 clearTimeout(window._levelTimer);
 window._levelTimer=setTimeout(()=>el.style.opacity='0',2200);
}
function barkBlast(){
 if(lucy.cool>0)return;
 lucy.cool=.34;lucy.bark=.20;sfx('bark');
 blasts.push({x:lucy.x+(lucy.face>0?lucy.w:-20),y:lucy.y+20,w:36,h:30,vx:lucy.face*720,life:.72,kind:'bark',power:1});
 burst(lucy.x+35,lucy.y+25,'#c783ff',12);
}

function enemyShot(x,y,dir){
 blasts.push({x,y,w:22,h:22,vx:dir*430,life:3,kind:'fire'});
}

function hurt(){
 if(lucy.inv>0)return;
 lucy.hp--;lucy.inv=1.1;sfx('hit');burst(lucy.x+35,lucy.y+25,'#ff3c5c',18);
 if(lucy.hp<=0){state='gameover';sfx('lose');}
}

function update(dt){
 if(state==='menu'){
  if(input.jump||input.attack){initAudio();startMusic();tone(520,.12,'sine',.05,760);input.jump=input.attack=false;score=0;loadLevel(0);state='play'}
  return;
 }
 if(state==='gameover'){
  if(input.jump||input.attack){input.jump=input.attack=false;loadLevel(level);state='play'}
  return;
 }
 if(state==='victory'){
  if(input.jump||input.attack){input.jump=input.attack=false;state='menu'}
  return;
 }

 for(const mp of movingPlatforms||[]){mp.t+=dt;mp.x=mp.baseX+Math.sin(mp.t*mp.speed)*mp.range}

 // More forgiving jumping: coyote time + double jump.
 if(lucy.onGround){lucy.coyote=.12;lucy.jumps=0}else lucy.coyote-=dt;
 if(input.jump && (lucy.coyote>0 || lucy.jumps<1)){
  lucy.vy=-650;lucy.onGround=false;lucy.coyote=0;lucy.jumps++;
  sfx(lucy.jumps===1?'jump':'double');
  burst(lucy.x+35,lucy.y+55,'#7ab8ff',7);
 }
 input.jump=false;
 if(input.attack)barkBlast();input.attack=false;

 lucy.vx=(input.left?-320:0)+(input.right?320:0);
 if(lucy.vx)lucy.face=Math.sign(lucy.vx);
 lucy.vy+=1600*dt;lucy.cool-=dt;lucy.inv-=dt;lucy.bark-=dt;
 moveEntity(lucy,dt);
 if(lucy.y>H+200)state='gameover';

 // Leo follows Lucy and helps fight nearby enemies.
 leo.attackCool-=dt;leo.attack-=dt;
 const followX=lucy.x-78*lucy.face;
 leo.face=lucy.face;
 leo.vx=Math.max(-220,Math.min(220,(followX-leo.x)*4));
 leo.vy+=1600*dt;
 moveEntity(leo,dt);
 if(Math.abs(lucy.x-leo.x)<95 && Math.abs(lucy.y-leo.y)<70 && leo.onGround) leo.vy=0;
 for(const e of enemies){
   if(!e.dead && Math.abs((leo.x+30)-(e.x+e.w/2))<48 && Math.abs(leo.y-e.y)<55 && leo.attackCool<=0){
     e.hp--;leo.attack=.22;leo.attackCool=.65;burst(e.x,e.y,'#ffb36b',10);
     if(e.hp<=0){e.dead=true;score+=100;sfx('enemy')}
   }
 }

 // Fanta Bomb obstacles: contact hurts Lucy, Bark Blast safely detonates them.
 for(const o of obstacles){
   o.blink+=dt;
   if(!o.dead && overlap(lucy,o)){
     o.dead=true;sfx('bomb');hurt();burst(o.x+21,o.y+21,'#ff8a1d',28);
   }
 }

 for(const e of enemies){
  e.vy+=1600*dt;
  // Patrol near original area, with occasional direction changes.
  if(Math.abs(e.x-e.startX)>150)e.vx*=-1;
  moveEntity(e,dt);
  if(e.vx===0)e.vx=(Math.random()>.5?1:-1)*(e.type==='rat'?95:60);
  if(overlap(lucy,e)&&lucy.inv<=0){
   if(lucy.vy>120&&lucy.y+lucy.h<e.y+30){
    e.hp--;lucy.vy=-430;
    if(e.hp<=0){e.dead=true;score+=100;sfx('enemy');burst(e.x,e.y,'#70ff80',22)}
   }else hurt();
  }
 }
 enemies=enemies.filter(e=>!e.dead);

 if(boss){
  if(!boss.active && lucy.x>boss.x-520){boss.active=true;showLevelBanner('FINAL BOSS — PRINCE FIREBALL')}
  if(boss.active){
   boss.phase=boss.hp<=18?2:1;boss.hitFlash-=dt;boss.summon-=dt;
   const target=lucy.x-boss.x;
   boss.vx=Math.abs(target)>240?Math.sign(target)*(boss.phase===2?105:65):0;
   boss.x+=boss.vx*dt;
   boss.cool-=dt;
   if(boss.cool<=0){
    boss.cool=boss.phase===2?0.78:1.35;
    const dir=Math.sign(target)||-1;
    enemyShot(boss.x+25,boss.y+48,dir);
    if(boss.phase===2){
      enemyShot(boss.x+50,boss.y+68,dir);
      enemyShot(boss.x+75,boss.y+48,dir);
    }
   }
   if(boss.phase===2 && boss.summon<=0){
    boss.summon=5;
    enemies.push({type:'rat',x:boss.x-120,y:boss.y+80,w:58,h:58,vx:-110,vy:0,hp:2,dead:false,startX:boss.x-120});
   }
   if(overlap(lucy,boss)&&lucy.inv<=0){
     if(lucy.vy>180 && lucy.y+lucy.h<boss.y+45){
       boss.hp-=2;boss.hitFlash=.25;lucy.vy=-470;sfx('bossHit');burst(boss.x+50,boss.y+35,'#ffe36a',20);
       if(boss.hp<=0){boss.hp=0;boss.defeated=true;score+=1500;burst(boss.x+50,boss.y+60,'#ffb03c',80);showLevelBanner('PRINCE FIREBALL DEFEATED!');sfx('win');state='victory'}
     } else hurt();
   }
  }
 }

 for(const b of blasts){
  b.x+=b.vx*dt;b.life-=dt;
  if(b.kind==='bark'){
   for(const o of obstacles)if(!o.dead&&overlap(b,o)){
     o.dead=true;b.life=0;score+=50;sfx('bomb');burst(o.x+21,o.y+21,'#ff8a1d',30);
   }
   for(const e of enemies)if(!e.dead&&overlap(b,e)){
    e.hp-=b.power;b.life=0;burst(e.x,e.y,'#b879ff',18);
    if(e.hp<=0){e.dead=true;score+=100;sfx('enemy')}
   }
   if(boss&&boss.active&&!boss.defeated&&overlap(b,boss)){
    boss.hp-=Math.max(1,b.power);boss.hitFlash=.22;b.life=0;sfx('bossHit');burst(boss.x+50,boss.y+60,'#79ff52',22);
    if(boss.hp<=0){boss.hp=0;boss.defeated=true;score+=1500;burst(boss.x+50,boss.y+60,'#ffb03c',80);showLevelBanner('PRINCE FIREBALL DEFEATED!');sfx('win');state='victory'}
   }
  }else if(b.kind==='fire'&&overlap(b,lucy)){b.life=0;hurt()}
 }
 blasts=blasts.filter(b=>b.life>0); enemies=enemies.filter(e=>!e.dead); obstacles=obstacles.filter(o=>!o.dead);

 for(const b of bones)if(!b.taken&&Math.abs(lucy.x+35-b.x)<42&&Math.abs(lucy.y+28-b.y)<48){
  b.taken=true;score+=25;bonesCollected++;sfx('collect');burst(b.x,b.y,'#ffe46b',10);
  if(bonesCollected%6===0&&lucy.hp<lucy.maxHp){lucy.hp++;showLevelBanner('LUCY FOUND A HEALTH BONE!')}
 }
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);

 if(goal&&overlap(lucy,goal)){
  if(level<3)loadLevel(level+1);
 }
 cam=Math.max(0,Math.min(lucy.x-W*.38,levels[level].len-W));
}
function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur}
function drawLucy(){
 const x=lucy.x,y=lucy.y,dir=lucy.face;
 glow('#777',14);
 // Shadow
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+40,y+57,36,7,0,0,Math.PI*2);ctx.fill();
 // Slightly chubby glossy black Labrador body
 const body=ctx.createLinearGradient(x,y,x+70,y+55);body.addColorStop(0,'#30343a');body.addColorStop(.5,'#111316');body.addColorStop(1,'#050607');
 ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(x+42,y+35,34,23,0,0,Math.PI*2);ctx.fill();
 // chest highlight
 ctx.fillStyle='#4b5057';ctx.globalAlpha=.32;ctx.beginPath();ctx.ellipse(x+46,y+26,17,8,-.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // legs
 ctx.fillStyle='#0a0b0d';ctx.fillRect(x+24,y+45,12,13);ctx.fillRect(x+58,y+45,12,13);
 // head
 ctx.fillStyle='#1b1e22';ctx.beginPath();ctx.arc(x+18,y+20,23,0,Math.PI*2);ctx.fill();
 // floppy ears
 ctx.fillStyle='#090a0c';ctx.beginPath();ctx.ellipse(x+3,y+26,10,18,.45,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(x+26,y+8,8,16,-.4,0,Math.PI*2);ctx.fill();
 // muzzle
 ctx.fillStyle='#343940';ctx.beginPath();ctx.ellipse(x+2,y+27,15,10,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(x-6,y+25,4,0,Math.PI*2);ctx.fill();
 // warm eye
 glow('#ffd875',8);ctx.fillStyle='#ffd875';ctx.beginPath();ctx.arc(x+15,y+14,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 // collar
 ctx.strokeStyle='#55ff98';ctx.lineWidth=4;glow('#55ff98',14);ctx.beginPath();ctx.arc(x+22,y+35,15,.2,2.8);ctx.stroke();ctx.shadowBlur=0;
 ctx.fillStyle='#7dffb3';ctx.beginPath();ctx.arc(x+22,y+47,3,0,Math.PI*2);ctx.fill();
 // wagging tail
 ctx.strokeStyle='#17191d';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+70,y+31);ctx.quadraticCurveTo(x+87,y+15+Math.sin(performance.now()/110)*8,x+94,y+24);ctx.stroke();ctx.lineCap='butt';
 // Bark pulse
 if(lucy.bark>0){ctx.strokeStyle='#c783ff';ctx.lineWidth=3;ctx.globalAlpha=lucy.bark*4;ctx.beginPath();ctx.arc(x+(dir>0?72:-4),y+22,25+(1-lucy.bark/.2)*35,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
}
function drawLeo(){
 const x=leo.x,y=leo.y;
 glow('#d48a42',10);
 // Ginger Cocker Spaniel body
 ctx.fillStyle='#b96e2f';ctx.beginPath();ctx.ellipse(x+34,y+30,28,18,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#c9823f';ctx.beginPath();ctx.arc(x+17,y+18,19,0,Math.PI*2);ctx.fill();
 // Long floppy ears
 ctx.fillStyle='#8a4c24';ctx.beginPath();ctx.ellipse(x+5,y+25,9,20,.35,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(x+28,y+25,8,18,-.25,0,Math.PI*2);ctx.fill();
 // muzzle and eye
 ctx.fillStyle='#e4ad70';ctx.beginPath();ctx.ellipse(x+7,y+25,12,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#25140c';ctx.beginPath();ctx.arc(x+14,y+13,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-2,y+23,3,0,Math.PI*2);ctx.fill();
 // legs
 ctx.fillStyle='#9f5929';ctx.fillRect(x+22,y+38,9,10);ctx.fillRect(x+48,y+38,9,10);
 // blue collar
 ctx.strokeStyle='#52b8ff';ctx.lineWidth=3;glow('#52b8ff',10);ctx.beginPath();ctx.arc(x+20,y+31,11,.2,2.8);ctx.stroke();ctx.shadowBlur=0;
 // happy tail
 ctx.strokeStyle='#b96e2f';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+60,y+28);ctx.quadraticCurveTo(x+72,y+14+Math.sin(performance.now()/120)*6,x+76,y+24);ctx.stroke();ctx.lineCap='butt';
 if(leo.attack>0){ctx.strokeStyle='#ffb36b';ctx.lineWidth=3;ctx.globalAlpha=leo.attack*4;ctx.beginPath();ctx.arc(x+20,y+22,30,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
}
function drawEnemy(e){
 if(e.type==='rat'){
  ctx.fillStyle='#667080';ctx.beginPath();ctx.ellipse(e.x+29,e.y+36,30,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e43d54';glow('#ff3c55',10);ctx.fillRect(e.x+12,e.y+25,7,6);ctx.fillRect(e.x+28,e.y+25,7,6);
 }else if(e.type==='forky'){
  ctx.fillStyle='#aa6cff';ctx.fillRect(e.x+10,e.y+24,28,44);
  for(let i=0;i<4;i++)ctx.fillRect(e.x+4+i*10,e.y,5,26);
 }else if(e.type==='trump'){
  // Cartoon enemy caricature: orange suit, red tie and exaggerated blond hair.
  ctx.fillStyle='#26344c';ctx.fillRect(e.x+9,e.y+34,36,38);
  ctx.fillStyle='#d92d34';ctx.fillRect(e.x+24,e.y+39,6,26);
  ctx.fillStyle='#e3a06c';ctx.beginPath();ctx.arc(e.x+27,e.y+22,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f0c44c';ctx.beginPath();ctx.moveTo(e.x+9,e.y+12);ctx.quadraticCurveTo(e.x+28,e.y-2,e.x+44,e.y+13);ctx.lineTo(e.x+32,e.y+9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(e.x+16,e.y+19,7,3);ctx.fillRect(e.x+31,e.y+19,7,3);
 }else{
  ctx.fillStyle='#65df6a';glow('#65ff72',15);ctx.beginPath();ctx.arc(e.x+29,e.y+29,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a5b24';for(let i=0;i<4;i++)ctx.fillRect(e.x+8+i*11,e.y+12+(i%2)*9,8,5);
 }
 ctx.shadowBlur=0;
}
function drawFantaBomb(o){
 const x=o.x,y=o.y,pulse=1+Math.sin(o.blink*5)*.08;
 ctx.save();
 ctx.translate(x+21,y+21);ctx.scale(pulse,pulse);ctx.translate(-21,-21);
 glow('#ff8a1d',18);
 // round orange soda-style bomb
 ctx.fillStyle='#ff7a18';ctx.beginPath();ctx.arc(21,24,18,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.arc(15,18,7,0,Math.PI*2);ctx.fill();
 // label
 ctx.fillStyle='#fff3d6';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText('FANTA',21,27);
 // fuse and spark
 ctx.strokeStyle='#3c2b18';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(24,8);ctx.quadraticCurveTo(30,0,35,5);ctx.stroke();
 ctx.fillStyle='#fff06a';ctx.beginPath();ctx.arc(36,5,3+Math.sin(o.blink*8)*1.2,0,Math.PI*2);ctx.fill();
 ctx.restore();ctx.shadowBlur=0;ctx.textAlign='left';
}function drawBoss(){
 if(!boss)return;
 const x=boss.x,y=boss.y;
 glow(boss.phase===2?'#70ff42':'#ff5638',boss.phase===2?30:22);
 // cloak
 ctx.fillStyle='#361016';ctx.beginPath();ctx.moveTo(x+18,y+45);ctx.lineTo(x+82,y+45);ctx.lineTo(x+100,y+140);ctx.lineTo(x,y+140);ctx.closePath();ctx.fill();
 // body
 ctx.fillStyle='#1f2a27';ctx.fillRect(x+30,y+55,40,65);
 // head
 ctx.fillStyle=boss.hitFlash>0?'#ffffff':'#d9b78a';ctx.beginPath();ctx.arc(x+50,y+34,25,0,Math.PI*2);ctx.fill();
 // crown
 ctx.fillStyle='#f0bf3e';ctx.beginPath();ctx.moveTo(x+28,y+18);ctx.lineTo(x+35,y);ctx.lineTo(x+50,y+16);ctx.lineTo(x+66,y);ctx.lineTo(x+73,y+18);ctx.closePath();ctx.fill();
 // green flame hand
 ctx.fillStyle='#66ff3d';glow('#6dff42',25);ctx.beginPath();ctx.arc(x+83,y+68,16,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
}

function draw(){
 const L=levels[level],grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,L.sky1);grad.addColorStop(1,L.sky2);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 // futuristic skyline
 for(let i=0;i<30;i++){
  const x=i*160-cam*.18,h=90+(i*53%180);
  ctx.fillStyle='rgba(35,50,85,.35)';ctx.fillRect(x,H-120-h,110,h);
  ctx.fillStyle='rgba(100,160,220,.16)';ctx.fillRect(x+15,H-105-h,8,4);
 }
 if(level===3){ctx.fillStyle='rgba(255,70,20,.18)';ctx.fillRect(0,H-90,W,90)}

 if(state==='menu'){
  ctx.textAlign='center';
  glow('#6aff9a',25);ctx.fillStyle='#6aff9a';ctx.font='bold '+Math.min(48,Math.max(32,W*.045))+'px Arial';ctx.fillText('LUCY',W/2,H*.24);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold '+Math.min(25,Math.max(18,W*.024))+'px Arial';ctx.fillText('LUCY & LEO — THE DOG HEROES',W/2,H*.24+38);
  ctx.fillStyle='#c7ffdc';ctx.font=Math.min(18,Math.max(13,W*.017))+'px Arial';ctx.fillText("Lucy and Leo must defeat Prince Fireball",W/2,H*.24+76);
  ctx.font='bold '+Math.min(24,Math.max(18,W*.024))+'px Arial';ctx.fillStyle='#ffd866';ctx.fillText('TAP JUMP OR 🐾 TO START',W/2,H*.63);
  ctx.font=Math.min(16,Math.max(11,W*.014))+'px Arial';ctx.fillStyle='#fff';ctx.fillText('Lucy & Leo • Double Jump • Fanta Bombs • Sound Effects',W/2,H*.63+34);
  ctx.textAlign='left';return;
 }

 ctx.save();ctx.translate(-cam,0);
 for(const p of platforms.concat(movingPlatforms||[])){
  ctx.fillStyle='#172339';ctx.fillRect(p.x,p.y,p.w,p.h);
  glow(L.theme,10);ctx.fillStyle=L.theme;ctx.fillRect(p.x,p.y,p.w,4);ctx.shadowBlur=0;
 }
 for(const b of bones)if(!b.taken){
  glow('#ffe36a',14);ctx.strokeStyle='#ffe36a';ctx.lineWidth=7;
  const by=b.y+Math.sin(performance.now()/260+b.bob)*4;ctx.beginPath();ctx.moveTo(b.x-8,by);ctx.lineTo(b.x+8,by);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x-10,by,5,0,Math.PI*2);ctx.arc(b.x+10,by,5,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
 }
 for(const o of obstacles)drawFantaBomb(o);
 for(const e of enemies)drawEnemy(e);
 if(goal){glow(L.theme,24);ctx.fillStyle=L.theme;ctx.fillRect(goal.x,goal.y,goal.w,goal.h);ctx.shadowBlur=0}
 if(boss)drawBoss();
 drawLucy();
 drawLeo();

 for(const b of blasts){
  if(b.kind==='bark'){glow('#c783ff',22);ctx.fillStyle='#c783ff';ctx.beginPath();ctx.arc(b.x,b.y,16,0,Math.PI*2);ctx.fill()}
  else {glow('#65ff3e',24);ctx.fillStyle='#65ff3e';ctx.beginPath();ctx.arc(b.x,b.y,11,0,Math.PI*2);ctx.fill()}
  ctx.shadowBlur=0;
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.7);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}
 ctx.globalAlpha=1;ctx.restore();

 // HUD
 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(12,12,480,64);
 ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText('🐕‍🦺 LUCY — BLACK LABRADOR HERO',25,35);
 ctx.fillStyle='#ff4564';ctx.font='23px Arial';ctx.fillText('♥'.repeat(Math.max(0,lucy.hp)),25,63);
 ctx.fillStyle='#ffe36a';ctx.fillText('✦ '+score,145,63);
 ctx.fillStyle='#cbd5ff';ctx.font='16px Arial';ctx.fillText('LEVEL '+(level+1)+' · '+L.name,245,63);

 if(boss&&boss.active){
  const bw=Math.min(350,W*.45),x=W/2-bw/2;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x,18,bw,36);
  ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('FINAL BOSS — PRINCE FIREBALL',W/2,32);
  ctx.fillStyle='#3b1111';ctx.fillRect(x+5,38,bw-10,10);
  ctx.fillStyle='#ff5638';ctx.fillRect(x+5,38,(bw-10)*(boss.hp/boss.maxHp),10);ctx.textAlign='left';
 }

 if(state==='gameover'||state==='victory'){
  ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle=state==='victory'?'#6aff9a':'#ff4a68';ctx.font='bold 44px Arial';
  ctx.fillText(state==='victory'?'LUCY SAVES THE FUTURE!':'LUCY NEEDS ANOTHER TRY!',W/2,H/2-25);
  ctx.fillStyle='#fff';ctx.font='21px Arial';
  ctx.fillText(state==='victory'?'Prince Fireball has been defeated — Lucy is the hero!':'Double jump and use Bark Blast to fight back!',W/2,H/2+25);
  ctx.textAlign='left';
 }
}

function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
