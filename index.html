<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prince Fireball</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#controls{position:fixed;inset:0;pointer-events:none;z-index:5}
.controls-left,.controls-right{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
.controls-left{left:20px}.controls-right{right:20px}
.btn{width:clamp(58px,12vw,100px);height:clamp(58px,12vw,100px);border-radius:18px;border:2px solid #57ff8b;background:rgba(8,22,34,.88);color:#fff;font-weight:bold;font-size:clamp(20px,4vw,34px);box-shadow:0 0 18px rgba(87,255,139,.45);touch-action:none}
.btn:active,.btn.active{background:#57ff8b;color:#07120a;box-shadow:0 0 28px #57ff8b}
#fire{border-color:#66ff33;box-shadow:0 0 20px rgba(80,255,40,.65)}
#jump{border-color:#57aaff}
#rotate{display:none;position:fixed;z-index:20;inset:0;background:#050611;color:#7dff9c;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <div class="controls-left">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
  </div>
  <div class="controls-right">
    <button class="btn" id="jump">JUMP</button>
    <button class="btn" id="fire">🔥</button>
  </div>
</div>
<div id="rotate">🔄<br><br>Prince Fireball is best played in landscape.<br><br>Please rotate your device.</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR,cam=0,last=0,gameOver=false,won=false,score=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);

const input={left:false,right:false,jump:false,fire:false};
function bind(id,key,once=false){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();input[key]=true;b.classList.add('active')};
 const up=e=>{e.preventDefault();if(!once)input[key]=false;b.classList.remove('active')};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
}
bind('left','left');bind('right','right');bind('jump','jump',true);bind('fire','fire',true);

const keys={};addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);

let player,enemies,shots,coins,particles,finish,platforms;
function reset(){
 gameOver=false;won=false;score=0;cam=0;shots=[];particles=[];
 const gy=H-120;
 player={x:90,y:gy-58,w:42,h:58,vx:0,vy:0,on:false,face:1,hp:3,inv:0,cool:0};
 platforms=[
  {x:0,y:gy,w:850,h:45},{x:980,y:gy,w:750,h:45},{x:1850,y:gy,w:950,h:45},
  {x:350,y:gy-140,w:180,h:24},{x:680,y:gy-230,w:170,h:24},{x:1100,y:gy-140,w:200,h:24},
  {x:1500,y:gy-240,w:170,h:24},{x:2050,y:gy-160,w:220,h:24}
 ];
 enemies=[
  {type:'Robo Rat',x:520,y:gy-44,w:50,h:44,vx:100,hp:1},
  {type:'Forky',x:1180,y:gy-66,w:44,h:66,vx:-70,hp:2},
  {type:'Sludge Brain',x:1580,y:gy-55,w:54,h:55,vx:65,hp:1},
  {type:'Robo Rat',x:2180,y:gy-44,w:50,h:44,vx:-110,hp:1}
 ];
 coins=[];for(let i=0;i<16;i++)coins.push({x:260+i*150,y:gy-70-(i%3)*55,taken:false});
 finish={x:2670,y:gy-100,w:30,h:100};
}
reset();

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,life:.5,color})}
function hurt(){if(player.inv>0)return;player.hp--;player.inv=1.2;burst(player.x+20,player.y+25,'#ff3b5c');if(player.hp<=0)gameOver=true}
function shoot(){if(player.cool>0)return;player.cool=.3;shots.push({x:player.x+(player.face>0?42:-10),y:player.y+27,w:18,h:12,vx:player.face*650,life:1.6})}
function physics(o,dt){
 o.x+=o.vx*dt;
 for(const p of platforms)if(hit(o,p)){if(o.vx>0)o.x=p.x-o.w;else if(o.vx<0)o.x=p.x+p.w;o.vx=0}
 o.y+=o.vy*dt;o.on=false;
 for(const p of platforms)if(hit(o,p)){if(o.vy>0){o.y=p.y-o.h;o.on=true}else if(o.vy<0)o.y=p.y+p.h;o.vy=0}
}
function update(dt){
 if(gameOver||won){if(input.jump||input.fire){reset();input.jump=input.fire=false}return}
 const left=input.left||keys.ArrowLeft||keys.KeyA,right=input.right||keys.ArrowRight||keys.KeyD;
 if((input.jump||keys.ArrowUp||keys.Space||keys.KeyW)&&player.on){player.vy=-620;player.on=false} input.jump=false;
 if(input.fire||keys.KeyF||keys.KeyX){shoot()} input.fire=false;
 player.vx=(left?-290:0)+(right?290:0);if(player.vx)player.face=Math.sign(player.vx);
 player.vy+=1550*dt;player.cool-=dt;player.inv-=dt;physics(player,dt);
 if(player.y>H+250){player.hp=0;gameOver=true}
 for(const e of enemies){
  e.vy=(e.vy||0)+1550*dt;e.x+=e.vx*dt;
  // simple enemy platform collision
  let supported=false;
  for(const p of platforms)if(e.x+e.w>p.x&&e.x<p.x+p.w&&e.y+e.h>=p.y-8&&e.y+e.h<=p.y+18){e.y=p.y-e.h;e.vy=0;supported=true}
  e.y+=e.vy*dt;if(!supported&&e.y>H+100)e.dead=true;
  if(e.x<50||e.x>2780)e.vx*=-1;
  if(hit(player,e)&&player.inv<=0){
   if(player.vy>100&&player.y+player.h<e.y+25){e.hp--;player.vy=-380;if(e.hp<=0){e.dead=true;burst(e.x,e.y,'#67ff75',18)}}else hurt();
  }
 }
 enemies=enemies.filter(e=>!e.dead);
 for(const s of shots){s.x+=s.vx*dt;s.life-=dt;for(const e of enemies)if(hit(s,e)){e.hp--;s.life=0;burst(e.x,e.y,'#66ff55',12);if(e.hp<=0){e.dead=true;burst(e.x,e.y,'#fff',8)}}}
 shots=shots.filter(s=>s.life>0);
 enemies=enemies.filter(e=>!e.dead);
 for(const c of coins)if(!c.taken&&Math.abs(player.x+21-c.x)<32&&Math.abs(player.y+30-c.y)<40){c.taken=true;score++;burst(c.x,c.y,'#ffe55c',6)}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 if(hit(player,finish))won=true;
 cam=Math.max(0,Math.min(player.x-W*.38,2700-W));
}
function glow(col,n){ctx.shadowColor=col;ctx.shadowBlur=n}
function draw(){
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#040511');bg.addColorStop(1,'#121329');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#11182e';for(let i=0;i<25;i++){let bx=i*180-cam*.18;ctx.fillRect(bx,H-120-(70+(i*53%180)),110,250)}
 ctx.save();ctx.translate(-cam,0);
 for(const p of platforms){ctx.fillStyle='#17243a';ctx.fillRect(p.x,p.y,p.w,p.h);glow('#00bfff',10);ctx.fillStyle='#00bfff';ctx.fillRect(p.x,p.y,p.w,4);ctx.shadowBlur=0}
 for(const c of coins)if(!c.taken){glow('#ffe45c',15);ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 for(const e of enemies){
  if(e.type==='Robo Rat'){ctx.fillStyle='#687384';glow('#ff3150',10);ctx.fillRect(e.x,e.y+15,45,29);ctx.fillStyle='#ff3150';ctx.fillRect(e.x+8,e.y+18,6,5);ctx.fillRect(e.x+20,e.y+18,6,5)}
  if(e.type==='Forky'){ctx.fillStyle='#9b65ff';glow('#b36cff',14);ctx.fillRect(e.x+8,e.y+18,28,48);for(let i=0;i<4;i++)ctx.fillRect(e.x+4+i*9,e.y,5,22)}
  if(e.type==='Sludge Brain'){ctx.fillStyle='#63ff69';glow('#63ff69',16);ctx.beginPath();ctx.arc(e.x+27,e.y+27,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#164f20';for(let i=0;i<4;i++)ctx.fillRect(e.x+8+i*10,e.y+12+(i%2)*9,7,5)}
  ctx.shadowBlur=0;
 }
 // finish
 ctx.fillStyle='#223047';ctx.fillRect(finish.x,finish.y,finish.w,finish.h);glow('#00ff99',22);ctx.fillStyle='#00ff99';ctx.fillRect(finish.x+finish.w,finish.y,55,8);ctx.shadowBlur=0;
 // player
 if(player.inv<=0||Math.floor(player.inv*12)%2===0){glow('#55ff83',18);ctx.fillStyle='#17221c';ctx.fillRect(player.x,player.y+15,42,43);ctx.fillStyle='#55ff83';ctx.beginPath();ctx.arc(player.x+21,player.y+17,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#cffff0';ctx.fillRect(player.x+11,player.y+13,7,5);ctx.fillRect(player.x+25,player.y+13,7,5);ctx.fillStyle='#e2b94c';ctx.fillRect(player.x+12,player.y-2,18,7);ctx.shadowBlur=0}
 for(const s of shots){glow('#55ff44',24);ctx.fillStyle='#55ff44';ctx.beginPath();ctx.arc(s.x,s.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efffd8';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
 ctx.restore();
 // HUD
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(12,12,340,58);ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText('👑 PRINCE FIREBALL',25,36);ctx.fillStyle='#ff4564';ctx.font='22px Arial';ctx.fillText('♥'.repeat(player.hp),25,61);ctx.fillStyle='#ffe35b';ctx.fillText('◉ '+score,125,61);
 if(gameOver||won){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=won?'#66ff88':'#ff4665';ctx.font='bold 44px Arial';ctx.fillText(won?'LEVEL COMPLETE!':'GAME OVER',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='22px Arial';ctx.fillText('Press JUMP or FIRE to restart',W/2,H/2+28);ctx.textAlign='left'}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
