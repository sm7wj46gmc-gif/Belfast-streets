<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Prince Fireball: Leo's Quest</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#050611;touch-action:none;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}
#controls{position:fixed;inset:0;z-index:4;pointer-events:none}.pad{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}#move{left:18px}#act{right:18px}
button{width:clamp(60px,12vw,98px);height:clamp(60px,12vw,98px);border-radius:50%;border:2px solid #60ff91;background:rgba(5,16,30,.86);color:white;font:bold clamp(16px,3vw,27px) Arial;box-shadow:0 0 20px #237c55;touch-action:none}button:active,.on{background:#60ff91;color:#05120a;transform:scale(.94)}#jump{border-color:#65aaff}#fire{border-color:#75ff35;box-shadow:0 0 22px #58dd25}
#rotate{display:none;position:fixed;z-index:9;inset:0;background:#050611;color:#7dff9c;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:25px}@media(orientation:portrait){#rotate{display:flex}}
</style></head><body><canvas id="game"></canvas><div id="controls"><div class="pad" id="move"><button id="left">◀</button><button id="right">▶</button></div><div class="pad" id="act"><button id="jump">JUMP</button><button id="fire">🔥</button></div></div><div id="rotate">👑🔥🐶<br><br>Rotate your device to landscape</div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d');let W,H,D,last=0,cam=0,state='menu',level=0,score=0,best=+localStorage.getItem('pf-leo-best')||0;
const I={l:0,r:0,j:0,f:0};function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
function bind(id,k,hold=1){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();I[k]=1;b.classList.add('on')};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{if(hold)I[k]=0;b.classList.remove('on')}))}
bind('left','l');bind('right','r');bind('jump','j',0);bind('fire','f',0);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')I.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')I.r=1;if(['Space','ArrowUp','KeyW'].includes(e.code))I.j=1;if(['KeyF','KeyX'].includes(e.code))I.f=1});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))I.l=0;if(['ArrowRight','KeyD'].includes(e.code))I.r=0});
const LV=[['NEON WASTELAND','#00d9ff',3000],['CYBER FACTORY','#b568ff',3300],['DARK CORE','#78ff4c',3600]];
let p,leo,plats,enemies,coins,shots,parts,goal;
function load(n){level=n;let gy=H-115,L=LV[n][2];p={x:100,y:gy-64,w:42,h:64,vx:0,vy:0,on:0,face:1,hp:3,inv:0,cool:0};leo={x:20,y:gy-42,w:54,h:42,vx:0,vy:0,on:0,tail:0};plats=[{x:0,y:gy,w:750,h:45},{x:900,y:gy,w:700,h:45},{x:1750,y:gy,w:700,h:45},{x:2600,y:gy,w:L-2600,h:45}];for(let x=280;x<L-250;x+=320)plats.push({x,y:gy-110-(Math.floor(x/320)%3)*55,w:170,h:25});let types=['rat','forky','brain','rat','brain','forky','rat'];enemies=types.map((t,i)=>({type:t,x:500+i*(L-850)/6,y:gy-55,w:t==='forky'?46:54,h:t==='forky'?70:54,vx:(i%2?1:-1)*(t==='rat'?110:72),vy:0,hp:t==='forky'?2:1}));coins=[];for(let x=180;x<L-100;x+=120)coins.push({x,y:gy-75-(Math.floor(x/120)%4)*26,t:0});shots=[];parts=[];goal={x:L-110,y:gy-105,w:28,h:105};cam=0}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,col,n=12){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*280,vy:(Math.random()-.5)*280,life:.55,col})}
function move(o,dt){o.x+=o.vx*dt;for(const q of plats)if(hit(o,q)){if(o.vx>0)o.x=q.x-o.w;else o.x=q.x+q.w;o.vx=0}o.y+=o.vy*dt;o.on=0;for(const q of plats)if(hit(o,q)){if(o.vy>0){o.y=q.y-o.h;o.on=1}else if(o.vy<0)o.y=q.y+q.h;o.vy=0}}
function hurt(){if(p.inv>0)return;p.hp--;p.inv=1.15;burst(p.x+20,p.y+30,'#ff3155',16);if(p.hp<=0)state='over'}
function fire(){if(p.cool>0)return;p.cool=.27;shots.push({x:p.x+(p.face>0?45:-8),y:p.y+30,w:18,h:12,vx:p.face*720,life:1.4});burst(p.x+20,p.y+28,'#73ff42',5)}
function update(dt){if(state!=='play'){if(I.j||I.f){I.j=I.f=0;if(state==='menu'){score=0;load(0)}else if(state==='over')load(level);state='play'}return}
if(I.j&&p.on){p.vy=-640;p.on=0}I.j=0;if(I.f)fire();I.f=0;p.vx=(I.l?-300:0)+(I.r?300:0);if(p.vx)p.face=Math.sign(p.vx);p.vy+=1580*dt;p.cool-=dt;p.inv-=dt;move(p,dt);
let dx=p.x-leo.x;leo.vx=Math.abs(dx)>70?Math.sign(dx)*Math.min(260,Math.abs(dx)*3):p.vx*.55;leo.vy+=1580*dt;move(leo,dt);leo.tail+=dt*14;
if(p.y>H+250){state='over'}
for(const e of enemies){e.vy+=1580*dt;move(e,dt);if(e.vx===0)e.vx=(Math.random()>.5?1:-1)*(e.type==='rat'?110:72);if(hit(p,e)&&p.inv<=0){if(p.vy>120&&p.y+p.h<e.y+25){e.hp--;p.vy=-410;if(e.hp<=0){e.dead=1;score+=50;burst(e.x,e.y,'#74ff50',18)}}else hurt()}}
enemies=enemies.filter(e=>!e.dead);
for(const s of shots){s.x+=s.vx*dt;s.life-=dt;for(const e of enemies)if(hit(s,e)){e.hp--;s.life=0;burst(e.x,e.y,'#76ff48',15);if(e.hp<=0){e.dead=1;score+=50}}}shots=shots.filter(s=>s.life>0);enemies=enemies.filter(e=>!e.dead);
for(const q of coins)if(!q.t&&Math.abs(p.x+21-q.x)<34&&Math.abs(p.y+30-q.y)<42){q.t=1;score+=10;burst(q.x,q.y,'#ffe35a',7)}
parts.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=430*dt;a.life-=dt});parts=parts.filter(a=>a.life>0);
if(hit(p,goal)){if(level<2)load(level+1);else{best=Math.max(best,score);localStorage.setItem('pf-leo-best',best);state='win'}}cam=Math.max(0,Math.min(p.x-W*.4,LV[level][2]-W))}
function gl(col,n){g.shadowColor=col;g.shadowBlur=n}
function drawLeo(){let x=leo.x,y=leo.y;gl('#ff9b4a',10);g.fillStyle='#c86e32';g.fillRect(x+10,y+14,36,23);g.beginPath();g.arc(x+14,y+13,15,0,Math.PI*2);g.fill();g.fillStyle='#e99755';g.beginPath();g.ellipse(x+4,y+20,8,16,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(x+17,y+8,7,15,.5,0,Math.PI*2);g.fill();g.fillStyle='#25140d';g.beginPath();g.arc(x+8,y+12,3,0,7);g.fill();g.fillStyle='#ff4f72';g.fillRect(x+30,y+17,18,3);g.strokeStyle='#c86e32';g.lineWidth=4;g.beginPath();g.moveTo(x+45,y+22);g.lineTo(x+55,y+16+Math.sin(leo.tail)*5);g.stroke();g.shadowBlur=0}
function drawEnemy(e){if(e.type==='rat'){g.fillStyle='#697486';g.fillRect(e.x,e.y+17,47,30);g.fillStyle='#ff3657';g.fillRect(e.x+8,e.y+21,6,5);g.fillRect(e.x+22,e.y+21,6,5)}else if(e.type==='forky'){g.fillStyle='#b56bff';g.fillRect(e.x+8,e.y+21,29,49);for(let i=0;i<4;i++)g.fillRect(e.x+4+i*9,e.y,5,23)}else{g.fillStyle='#70ff62';g.beginPath();g.arc(e.x+27,e.y+27,27,0,7);g.fill();g.fillStyle='#174d20';for(let i=0;i<4;i++)g.fillRect(e.x+8+i*10,e.y+12+(i%2)*9,7,5)}}
function draw(){let col=LV[Math.min(level,2)][1],sky=LV[Math.min(level,2)][0];let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#05071a');bg.addColorStop(1,'#10162b');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<30;i++){g.fillStyle='rgba(75,100,170,.16)';g.fillRect(i*150-cam*.15,H-115-(60+i*47%180),105,240)}
if(state==='menu'){g.textAlign='center';gl('#74ff8c',26);g.fillStyle='#74ff8c';g.font='bold 52px Arial';g.fillText('PRINCE FIREBALL',W/2,H*.30);g.shadowBlur=0;g.font='30px Arial';g.fillStyle='#ff9b4a';g.fillText('and Leo 🐶',W/2,H*.30+45);g.fillStyle='white';g.font='21px Arial';g.fillText('A Dark Futuristic Adventure',W/2,H*.30+90);g.fillStyle='#baffca';g.font='bold 27px Arial';g.fillText('TAP JUMP OR FIRE TO START',W/2,H*.65);g.fillStyle='#ffe35a';g.font='17px Arial';g.fillText('Best Score: '+best,W/2,H*.65+38);g.textAlign='left';return}
g.save();g.translate(-cam,0);for(const q of plats){g.fillStyle='#17243a';g.fillRect(q.x,q.y,q.w,q.h);gl(col,10);g.fillStyle=col;g.fillRect(q.x,q.y,q.w,4);g.shadowBlur=0}for(const q of coins)if(!q.t){gl('#ffe35a',14);g.fillStyle='#ffd83e';g.beginPath();g.arc(q.x,q.y,10,0,7);g.fill();g.shadowBlur=0}for(const e of enemies){gl(e.type==='rat'?'#ff3657':e.type==='forky'?'#b56bff':'#70ff62',14);drawEnemy(e);g.shadowBlur=0}gl(col,22);g.fillStyle=col;g.fillRect(goal.x,goal.y,goal.w,goal.h);g.shadowBlur=0;
drawLeo();if(p.inv<=0||Math.floor(p.inv*10)%2===0){gl('#59ff83',18);g.fillStyle='#18231d';g.fillRect(p.x,p.y+16,42,48);g.fillStyle='#59ff83';g.beginPath();g.arc(p.x+21,p.y+18,19,0,7);g.fill();g.fillStyle='#d8ffe4';g.fillRect(p.x+11,p.y+14,7,5);g.fillRect(p.x+25,p.y+14,7,5);g.fillStyle='#e4ba4b';g.fillRect(p.x+12,p.y-2,18,7);g.shadowBlur=0}for(const s of shots){gl('#75ff42',24);g.fillStyle='#75ff42';g.beginPath();g.arc(s.x,s.y,10,0,7);g.fill();g.fillStyle='#efffd8';g.beginPath();g.arc(s.x,s.y,4,0,7);g.fill();g.shadowBlur=0}for(const a of parts){g.globalAlpha=Math.max(0,a.life*2);g.fillStyle=a.col;g.fillRect(a.x,a.y,4,4)}g.globalAlpha=1;g.restore();
g.fillStyle='rgba(0,0,0,.55)';g.fillRect(12,12,410,62);g.fillStyle='white';g.font='bold 17px Arial';g.fillText('👑 PRINCE FIREBALL  +  🐶 LEO',25,36);g.fillStyle='#ff4d68';g.font='22px Arial';g.fillText('♥'.repeat(p.hp),25,63);g.fillStyle='#ffe35a';g.fillText('✦ '+score,125,63);g.fillStyle='#b9c9ff';g.font='16px Arial';g.fillText('LEVEL '+(level+1)+' · '+LV[level][0],210,63);
if(state==='over'||state==='win'){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle=state==='win'?'#70ff8c':'#ff4b68';g.font='bold 44px Arial';g.fillText(state==='win'?'LEO AND THE PRINCE WIN!':'GAME OVER',W/2,H/2-25);g.fillStyle='white';g.font='21px Arial';g.fillText('Tap JUMP or FIRE',W/2,H/2+28);g.textAlign='left'}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
