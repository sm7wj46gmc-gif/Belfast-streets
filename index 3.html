<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Belfast Streets V60 Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131c;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#12212b}
#start{position:fixed;inset:0;z-index:100;background:linear-gradient(#0b1823,#081019);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(92vw,560px);padding:38px 24px;border:1px solid #4c7694;border-radius:28px;background:#132432;text-align:center;box-shadow:0 20px 70px #0008}
h1{font-size:clamp(42px,11vw,68px);margin:0;color:#83c7ff;letter-spacing:2px}
h2{font-size:clamp(30px,8vw,52px);margin:4px 0 28px;color:#83c7ff}
p{font-size:18px;line-height:1.5;color:#c9d2dc}
#play{appearance:none;border:0;border-radius:18px;padding:20px 28px;width:100%;font-size:24px;font-weight:800;color:#fff;background:linear-gradient(#5aa9e5,#246ba5);box-shadow:0 8px 24px #0008;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;pointer-events:none;justify-content:space-between;font-weight:700;font-size:13px;text-shadow:0 2px 4px #000}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:6;display:none;background:#09121bd9;border:1px solid #ffffff33;border-radius:14px;padding:10px 16px;font-size:12px;text-align:center;max-width:90vw}
#controls{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom) + 14px) 0;z-index:7;display:none;pointer-events:none}
.pad{position:absolute;bottom:0;width:150px;height:150px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff25;pointer-events:auto}
#leftPad{left:18px}#rightPad{right:18px}
.pad b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:#ffffff99}
#message{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);z-index:8;display:none;background:#101b25e8;border:1px solid #ffffff22;border-radius:12px;padding:10px 16px;font-size:13px;max-width:85vw;text-align:center}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud"><span id="place">BELFAST • CITY CENTRE</span><span id="speed">0 KM/H</span></div>
<div id="message"></div>
<div id="hint">Use the left pad to steer • right pad to drive</div>
<div id="controls"><div class="pad" id="leftPad"><b>STEER</b></div><div class="pad" id="rightPad"><b>DRIVE</b></div></div>

<div id="start">
  <div class="card">
    <h1>BELFAST</h1><h2>STREETS V60</h2>
    <p><b>MOBILE EDITION</b><br>Tap below to enter the city.</p>
    <button id="play" type="button">ENTER BELFAST V60</button>
  </div>
</div>

<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=0,H=0,dpr=1,running=false;
var car={x:0,y:0,a:0,speed:0};
var input={left:false,right:false,drive:false,brake:false};
var keys={};
var last=0,elapsed=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  car.x=W/2; car.y=H/2;
}
window.addEventListener('resize',resize);
resize();

function startGame(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(running)return;
  running=true;
  document.getElementById('start').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('controls').style.display='block';
  document.getElementById('hint').style.display='block';
  show('Welcome to Belfast Streets V60');
  requestAnimationFrame(loop);
}
document.getElementById('play').addEventListener('click',startGame);
document.getElementById('play').addEventListener('touchend',startGame,{passive:false});
document.getElementById('play').addEventListener('pointerup',startGame);

function bindPad(id,kind){
  var el=document.getElementById(id);
  function set(e,on){
    if(e.cancelable)e.preventDefault();
    var r=el.getBoundingClientRect(),x=e.touches?e.touches[0].clientX:e.clientX;
    if(kind==='steer'){
      input.left=on && x<r.left+r.width/2;
      input.right=on && x>=r.left+r.width/2;
    } else input.drive=on;
  }
  el.addEventListener('touchstart',e=>set(e,true),{passive:false});
  el.addEventListener('touchmove',e=>set(e,true),{passive:false});
  el.addEventListener('touchend',e=>{input.left=input.right=input.drive=false;if(e.cancelable)e.preventDefault()},{passive:false});
  el.addEventListener('touchcancel',e=>{input.left=input.right=input.drive=false},{passive:false});
  el.addEventListener('pointerdown',e=>set(e,true));
  el.addEventListener('pointerup',e=>{input.left=input.right=input.drive=false});
}
bindPad('leftPad','steer'); bindPad('rightPad','drive');

window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function show(t){
 var m=document.getElementById('message');m.textContent=t;m.style.display='block';
 clearTimeout(show.t);show.t=setTimeout(()=>m.style.display='none',2400);
}

function update(dt){
 var turn=(input.left||keys.a||keys.arrowleft?-1:0)+(input.right||keys.d||keys.arrowright?1:0);
 var go=input.drive||keys.w||keys.arrowup;
 var stop=input.brake||keys.s||keys.arrowdown;
 if(go) car.speed=Math.min(260,car.speed+180*dt);
 else car.speed=Math.max(0,car.speed-65*dt);
 if(stop) car.speed=Math.max(-80,car.speed-220*dt);
 car.a+=turn*(car.speed/100)*1.8*dt;
 car.x+=Math.sin(car.a)*car.speed*dt;
 car.y-=Math.cos(car.a)*car.speed*dt;
 if(car.x<28||car.x>W-28||car.y<90||car.y>H-28){car.x=Math.max(28,Math.min(W-28,car.x));car.y=Math.max(90,Math.min(H-28,car.y));car.speed*=0.5}
 document.getElementById('speed').textContent=Math.round(Math.abs(car.speed)*0.45)+' KM/H';
 elapsed+=dt;
 if(elapsed>25){elapsed=0;show(['City Hall nearby','Exploring Belfast','Titanic Quarter route unlocked','City event available'][Math.floor(Math.random()*4)]);}
}

function road(x,y,w,h){
 ctx.fillStyle='#2b3439';ctx.fillRect(x,y,w,h);
 ctx.strokeStyle='#667078';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
 ctx.strokeStyle='#d9c976';ctx.lineWidth=2;ctx.setLineDash([14,14]);
 ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();ctx.setLineDash([]);
}
function building(x,y,w,h,label){
 ctx.fillStyle='#3f515b';ctx.fillRect(x+6,y+8,w,h);
 ctx.fillStyle='#63727a';ctx.fillRect(x,y,w,h);
 ctx.fillStyle='#8eb7c7';
 for(var yy=y+10;yy<y+h-6;yy+=14)for(var xx=x+8;xx<x+w-5;xx+=15)ctx.fillRect(xx,yy,7,6);
 ctx.fillStyle='#e8eef1';ctx.font='10px Arial';ctx.fillText(label,x,y-7);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#315446';ctx.fillRect(0,0,W,H);
 // parks / river
 ctx.fillStyle='#244f69';ctx.fillRect(W*.58,0,W*.12,H);
 road(0,H*.43,W,H*.16); road(W*.42,0,W*.16,H);
 building(W*.08,H*.13,120,100,'CITY CENTRE');
 building(W*.72,H*.15,130,130,'TITANIC QUARTER');
 building(W*.08,H*.72,150,90,'BOTANIC');
 building(W*.70,H*.70,130,100,'EAST BELFAST');
 // landmark
 ctx.fillStyle='#d8c8a6';ctx.fillRect(W*.45,H*.17,110,75);
 ctx.fillStyle='#f0e0bb';for(var i=0;i<5;i++)ctx.fillRect(W*.46+i*20,H*.20,8,42);
 ctx.fillStyle='#fff3c4';ctx.font='11px Arial';ctx.fillText('BELFAST CITY HALL',W*.43,H*.14);
 // car shadow and car
 ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-12,-18,30,48);
 ctx.fillStyle='#d94343';ctx.fillRect(-13,-23,26,46);
 ctx.fillStyle='#9dd8ff';ctx.fillRect(-9,-15,18,18);
 ctx.fillStyle='#111';ctx.fillRect(-15,-15,4,12);ctx.fillRect(11,-15,4,12);ctx.fillRect(-15,8,4,12);ctx.fillRect(11,8,4,12);
 ctx.restore();
}
function loop(t){
 if(!running)return;
 var dt=Math.min(.05,(t-last||16)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
